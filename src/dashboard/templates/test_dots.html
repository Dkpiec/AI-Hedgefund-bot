<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Hedge Fund Bot - Dots Only</title>
<style>
  body { background: #0B120E; color: #c8e6c9; font-family: monospace; padding: 20px; margin: 0; }
  #timeline {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    padding: 12px;
    background: #0a120e;
    border: 1px solid #4a9a3d;
    border-radius: 6px;
    min-height: 40px;
  }
  .dot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  .dot.fresh { animation-duration: 1.0s; }
  .dot.stale { opacity: 0.5; }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.6); }
  }
  .label { color: #75E063; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="label">Trade Timeline (dots only):</div>
  <div id="timeline"></div>

<script>
  const assetColors = { 'EURUSDm': '#75E063', 'GBPUSDm': '#FFD700', 'BTCUSDm': '#FF6B6B', 'XAUUSDm': '#FFA500', 'USDJPYm': '#00BFFF' };
  const sample = [
    { asset: 'BTCUSDm', time: new Date().toISOString() },
    { asset: 'EURUSDm', time: new Date(Date.now()-30000).toISOString() },
    { asset: 'XAUUSDm', time: new Date(Date.now()-60000).toISOString() },
    { asset: 'GBPUSDm', time: new Date(Date.now()-90000).toISOString() },
    { asset: 'USDJPYm', time: new Date(Date.now()-120000).toISOString() },
    { asset: 'BTCUSDm', time: new Date(Date.now()-150000).toISOString() },
    { asset: 'EURUSDm', time: new Date(Date.now()-180000).toISOString() },
    { asset: 'XAUUSDm', time: new Date(Date.now()-210000).toISOString() },
    { asset: 'BTCUSDm', time: new Date(Date.now()-240000).toISOString() },
    { asset: 'GBPUSDm', time: new Date(Date.now()-270000).toISOString() },
  ];
  const tl = document.getElementById('timeline');
  tl.innerHTML = sample.map((t, i) => {
    const c = assetColors[t.asset] || '#75E063';
    const cls = i === 0 ? 'fresh' : (i > 6 ? 'stale' : '');
    return '<span class="dot ' + cls + '" title="' + t.asset + ' @ ' + new Date(t.time).toLocaleTimeString() + '" style="background:' + c + ';box-shadow:0 0 8px ' + c + ';"></span>';
  }).join('');
</script>
</body>
</html>
