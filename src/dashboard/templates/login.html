<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hedge Fund Bot - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        'primary-dark': '#059669',
                        bg: '#0F172A',
                        'bg-card': '#1E293B',
                        'border': '#334155',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-bg-card rounded-2xl border border-border p-8 shadow-2xl">
            <!-- Logo / Title -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/20 mb-4">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white">AI Hedge Fund Bot</h1>
                <p class="text-slate-400 mt-1">Sign in to access the dashboard</p>
            </div>

            <!-- Error Message -->
            {% if error %}
            <div class="mb-6 p-4 bg-red-900/30 border border-red-700 rounded-lg text-red-300 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="post" class="space-y-5">
                <input type="hidden" name="next" value="{{ next }}">
                
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        autocomplete="username"
                        required
                        class="w-full px-4 py-3 bg-bg/50 border border-border rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                        placeholder="Enter username"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        autocomplete="current-password"
                        required
                        class="w-full px-4 py-3 bg-bg/50 border border-border rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                        placeholder="Enter password"
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full py-3 bg-primary hover:bg-primary-dark text-white font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-bg"
                >
                    Sign In
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-6 text-center">
                <p class="text-slate-500 text-sm">
                    <a href="https://github.com/Dkpiec/AI-Hedgefund-bot" target="_blank" class="text-primary hover:underline">View on GitHub</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
