services:
  - type: web
    name: ai-hedgefund-api
    runtime: python
    plan: free
    branch: main
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "cd src && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info"
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: MT5_ACCOUNT
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_SERVER
        value: MetaQuotes-Demo
      - key: STARTING_BALANCE
        value: "100"
      - key: PAPER_MODE
        value: "true"
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PORT
        value: "8000"
      - key: PORT
        value: "8000"
