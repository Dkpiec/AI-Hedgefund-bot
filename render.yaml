services:
  - type: web
    name: ai-hedgefund-api
    runtime: python
    plan: free
    branch: main
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "cd src && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info"
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_TESTNET
        value: "true"
      - key: STARTING_BALANCE
        value: "200"
      - key: MAX_PRICE_USD
        value: "2000"
      - key: MIN_24H_VOLUME_USDT
        value: "50000000"
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PORT
        value: "8000"
      - key: PORT
        value: "8000"
